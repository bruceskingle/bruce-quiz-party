[package]
name = "bruce-quiz-generator"
description = "Writes quiz drafts from Wikipedia with Claude, for Bruce's Quiz Party: used by the controller's Quizzes page, and from the command line."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
quiz-format.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
rand = "0.9"
# Wikipedia's and Wikimedia Commons' APIs, over macOS's own TLS and certificates, see wikipedia.rs.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default", "json", "gzip"] }
# The user's key for Claude's API, in the Keychain, see api_key.rs; the same as Bruce's Smart Home uses.
keyring = "4.2"
