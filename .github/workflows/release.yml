# Made by bruce-method-release's setup from its release-app-store.yml template. Change the template, or this
# repository's hooks, not this file: setup replaces it, and the release checks fail while it differs.
#
# Builds the App Store's apps for a tag, signs them for App Store Connect, and, for a release, uploads them there, where
# they appear in TestFlight once Apple has processed them. Pushing the tag runs it, so that it runs before it is on
# main, where the Actions tab could: testX.Y.Z, pushed by bruce-method-release's try, builds and checks the apps
# without uploading them, and releaseX.Y.Z, pushed by its release, uploads them. It can also be run by hand, from the
# Actions tab, e.g. to upload again. Submitting a build for App Review is done in App Store Connect.
#
# Signing is automatic: with the App Store Connect API key, xcodebuild makes the provisioning profiles and uses Apple's
# cloud-managed distribution certificates, so no certificate or profile is kept in the repository's secrets. The key
# needs the Admin role for that. A Mac app made with Dioxus is put in an Xcode archive of its own, so that xcodebuild
# signs and uploads it as it does one Xcode made.
#
# Its secrets: APPLE_TEAM_ID, the team's ID; and the App Store Connect API key, APPLE_API_KEY (its ID),
# APPLE_API_ISSUER (its issuer's ID) and APPLE_API_KEY_CONTENT (the .p8 file, base64 encoded).
name: Release

on:
  push:
    tags: ["test*", "release*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, e.g. release0.1.0"
        required: true
      upload:
        description: "Upload the apps to App Store Connect"
        type: boolean
        default: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Whether to upload the apps: when asked, by hand, or for a release tag pushed; a try only keeps them, as artifacts.
  UPLOAD: ${{ inputs.upload || (github.event_name == 'push' && startsWith(github.ref_name, 'release')) }}
  # The App Store's build number, which must go up with every upload of a version: the workflow's run number does.
  BUILD: ${{ github.run_number }}
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  ios:
    name: Build the iOS app, QuizParty
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Check out bruce-quiz-party
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The version, from the tag, e.g. 0.1.0 from release0.1.0 or test0.1.0, and the API key, in a file, as
      # xcodebuild needs it. They go to the later steps through GITHUB_ENV.
      - name: Set up the version and the API key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$API_KEY_CONTENT" ]; then
            echo "The repository has no App Store Connect API key secrets, see the workflow's first comment"
            exit 1
          fi
          version="${TAG#release}"
          version="${version#test}"
          key_path="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
          printf '%s' "$API_KEY_CONTENT" | base64 --decode > "$key_path"
          {
            echo "VERSION=$version"
            echo "KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      # With the team, automatic signing and the version on the command line, which override the project's own, e.g.
      # its git-ignored Signing.xcconfig, which the runner does not have.
      - name: Archive QuizParty
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild -version
          xcodebuild archive \
            -project "ios/QuizParty.xcodeproj" \
            -scheme "QuizParty" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY" \
            -authenticationKeyIssuerID "$API_ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD"

      # Signs the archive for App Store Connect, making the provisioning profile and using the cloud-managed
      # certificates, and uploads it, or, for a try, only exports it, which checks the signing as an upload would.
      - name: Export the iOS app for App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DESTINATION: ${{ env.UPLOAD == 'true' && 'upload' || 'export' }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert destination -string "$DESTINATION" "$options"
          plutil -insert teamID -string "$TEAM" "$options"
          plutil -insert signingStyle -string automatic "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportPath "$RUNNER_TEMP/dist" \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY" \
            -authenticationKeyIssuerID "$API_ISSUER"
          ls -l "$RUNNER_TEMP/dist"

      - name: Keep the iOS app
        if: ${{ env.UPLOAD != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error

  macos:
    name: Build the Mac app, in server
    runs-on: macos-latest
    env:
      # The dioxus version in Cargo.lock.
      DX_VERSION: "0.7.10"
      # The oldest macOS the app runs on. It is built for Apple silicon only, which the App Store accepts from
      # macOS 12; a universal build, for Intel Macs too, would take twice as long.
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - name: Check out bruce-quiz-party
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The version, from the tag, e.g. 0.1.0 from release0.1.0 or test0.1.0, and the API key, in a file, as
      # xcodebuild needs it. They go to the later steps through GITHUB_ENV.
      - name: Set up the version and the API key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$API_KEY_CONTENT" ]; then
            echo "The repository has no App Store Connect API key secrets, see the workflow's first comment"
            exit 1
          fi
          version="${TAG#release}"
          version="${version#test}"
          key_path="$RUNNER_TEMP/AuthKey_$API_KEY.p8"
          printf '%s' "$API_KEY_CONTENT" | base64 --decode > "$key_path"
          {
            echo "VERSION=$version"
            echo "KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      # The Dioxus CLI is built from source with its own Cargo.lock, rather than downloading a prebuilt binary, which
      # takes about ten minutes, so what was built is kept in the cache for the next run of the same version.
      - name: Find the Dioxus CLI in the cache
        id: dx
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx*
          key: dx-${{ runner.os }}-${{ runner.arch }}-${{ env.DX_VERSION }}

      - name: Install the Dioxus CLI
        if: steps.dx.outputs.cache-hit != 'true'
        run: cargo install dioxus-cli --version "$DX_VERSION" --locked

      - name: Run the tests
        run: cargo test --workspace --locked

      - name: Build the app
        working-directory: server
        run: dx build --release --platform desktop --features store

      # The app's name, if it is given one, and the App Store's version, build number, category, oldest macOS and, if
      # exempt, its encryption in its Info.plist, and its icon, which dx build names there but, unlike dx bundle, does
      # not copy in: the .icns among the icons in Dioxus.toml. Then it is signed here, without a certificate, only to
      # carry its entitlements, e.g. the App Sandbox's, which the export keeps when it signs it for the store.
      - name: Prepare the app
        run: |
          app=$(find target/dx -path '*/release/macos/*.app' -maxdepth 5 -type d | head -1)
          if [ -z "$app" ]; then
            echo "The app was not built"
            exit 1
          fi
          renamed="$(dirname "$app")/Bruce's Quiz Party.app"
          mv "$app" "$renamed"
          app="$renamed"
          info="$app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$info"
          plutil -replace CFBundleVersion -string "$BUILD" "$info"
          plutil -replace LSApplicationCategoryType -string "public.app-category.trivia-games" "$info"
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO "$info"
          plutil -replace CFBundleName -string "Bruce's Quiz Party" "$info"
          plutil -replace CFBundleDisplayName -string "Bruce's Quiz Party" "$info"
          plutil -replace LSMinimumSystemVersion -string "$MACOSX_DEPLOYMENT_TARGET" "$info"
          icon=$(grep -o '"[^"]*\.icns"' "server/Dioxus.toml" | head -1 | tr -d '"')
          if [ -z "$icon" ]; then
            echo "The App Store needs an icon: add an .icns to the bundle's icons in server/Dioxus.toml"
            exit 1
          fi
          mkdir -p "$app/Contents/Resources"
          cp "server/$icon" "$app/Contents/Resources/$(basename "$icon")"
          plutil -replace CFBundleIconFile -string "$(basename "$icon")" "$info"
          codesign --force --deep --sign - --entitlements "server/store.entitlements" "$app"
          echo "APP=$app" >> "$GITHUB_ENV"

      # An Xcode archive of the app, as Xcode makes one, so that xcodebuild exports it as it would one of its own.
      - name: Archive the app
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          archive="$RUNNER_TEMP/app.xcarchive"
          name=$(basename "$APP")
          mkdir -p "$archive/Products/Applications"
          cp -R "$APP" "$archive/Products/Applications/"
          info="$APP/Contents/Info.plist"
          identifier=$(plutil -extract CFBundleIdentifier raw "$info")
          plist="$archive/Info.plist"
          plutil -create xml1 "$plist"
          plutil -insert ApplicationProperties -dictionary "$plist"
          plutil -insert ApplicationProperties.ApplicationPath -string "Applications/$name" "$plist"
          plutil -insert ApplicationProperties.CFBundleIdentifier -string "$identifier" "$plist"
          plutil -insert ApplicationProperties.CFBundleShortVersionString -string "$VERSION" "$plist"
          plutil -insert ApplicationProperties.CFBundleVersion -string "$BUILD" "$plist"
          plutil -insert ApplicationProperties.Architectures -array "$plist"
          for architecture in $(lipo -archs "$APP/Contents/MacOS/"*); do
            plutil -insert ApplicationProperties.Architectures -string "$architecture" -append "$plist"
          done
          plutil -insert ApplicationProperties.SigningIdentity -string "Apple Distribution" "$plist"
          plutil -insert ApplicationProperties.Team -string "$TEAM" "$plist"
          plutil -insert ArchiveVersion -integer 2 "$plist"
          plutil -insert CreationDate -date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$plist"
          plutil -insert Name -string "${name%.app}" "$plist"
          plutil -insert SchemeName -string "${name%.app}" "$plist"
          plutil -p "$plist"

      # Signs the archive for App Store Connect, making the provisioning profile and using the cloud-managed
      # certificates, and uploads it, or, for a try, only exports it, which checks the signing as an upload would.
      - name: Export the Mac app for App Store Connect
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DESTINATION: ${{ env.UPLOAD == 'true' && 'upload' || 'export' }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert destination -string "$DESTINATION" "$options"
          plutil -insert teamID -string "$TEAM" "$options"
          plutil -insert signingStyle -string automatic "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportPath "$RUNNER_TEMP/dist" \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$API_KEY" \
            -authenticationKeyIssuerID "$API_ISSUER"
          for package in "$RUNNER_TEMP"/dist/*.pkg; do
            [ -e "$package" ] && mv "$package" "$RUNNER_TEMP/dist/BrucesQuizParty.pkg"
          done
          ls -l "$RUNNER_TEMP/dist"

      - name: Keep the Mac app
        if: ${{ env.UPLOAD != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
